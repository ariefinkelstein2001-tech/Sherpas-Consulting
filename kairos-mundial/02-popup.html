<!-- ===================================================================== -->
<!--  KAIROS · POP-UP DE ENTRADA · POLLA MUNDIAL                           -->
<!--                                                                       -->
<!--  >>> PARA QUE APAREZCA EN TODA LA TIENDA (al entrar a cualquier       -->
<!--      página), pégalo SITE-WIDE, no solo en la home:                   -->
<!--   · Tema Shopify: Acciones > Editar código > theme.liquid, pega este  -->
<!--     bloque completo justo ANTES de </body>.                           -->
<!--   · (Si solo lo quieres en la home, pégalo en una sección Custom      -->
<!--     Liquid de la Home.)                                               -->
<!--                                                                       -->
<!--  Se muestra 1 vez cada 2 días por visitante (localStorage).           -->
<!--  Cambia el "v1" del KEY si quieres volver a mostrárselo a todos.      -->
<!--  Al hacer click lleva a la sección Mundial (/pages/mundial).          -->
<!-- ===================================================================== -->

<div id="km-pop-overlay" class="km-pop-overlay" role="dialog" aria-modal="true" aria-label="Polla Mundial Kairos">
  <div class="km-pop">
    <button class="km-pop-x" id="km-pop-x" aria-label="Cerrar">✕</button>
    <a href="/pages/mundial" id="km-pop-link" class="km-pop-link">
      <img src="https://cdn.shopify.com/s/files/1/0668/0081/2327/files/IMG-2197.jpg?v=1781290111" alt="Polla Mundial Kairos - Participa">
    </a>
  </div>
</div>

<style>
  .km-pop-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(3,7,10,.78);backdrop-filter:blur(3px)}
  .km-pop-overlay.km-show{display:flex;animation:kmPopFade .3s ease}
  @keyframes kmPopFade{from{opacity:0}to{opacity:1}}
  .km-pop{position:relative;width:100%;max-width:440px;animation:kmPopIn .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes kmPopIn{from{transform:translateY(30px) scale(.95);opacity:0}to{transform:none;opacity:1}}
  .km-pop-link{display:block;line-height:0}
  .km-pop-link img{width:100%;height:auto;display:block;border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .km-pop-x{position:absolute;top:-14px;right:-14px;z-index:3;width:36px;height:36px;border-radius:50%;cursor:pointer;
    border:2px solid #fff;background:#06131a;color:#fff;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s}
  .km-pop-x:hover{transform:scale(1.1);background:#ffce1f;color:#06131a}
  @media(max-width:480px){.km-pop-x{top:-10px;right:-10px}}
</style>

<script>
(function(){
  var KEY='km_pop_polla_img_v1';      // cambia el v1 para re-mostrarlo a todos
  var DIAS=2;
  var DELAY=700;                       // ms antes de mostrarlo (suaviza la entrada)
  function seen(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function mark(){ try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} }
  function fresh(){ var t=seen(); if(!t) return false; return (Date.now()-parseInt(t,10)) < DIAS*86400000; }

  var ov=document.getElementById('km-pop-overlay');
  if(!ov || fresh()){ if(ov) ov.remove(); return; }
  if(document.body && ov.parentNode!==document.body){ document.body.appendChild(ov); }

  function close(){ mark(); ov.remove(); }
  document.getElementById('km-pop-x').addEventListener('click', function(e){ e.preventDefault(); close(); });
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  document.getElementById('km-pop-link').addEventListener('click', mark);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  setTimeout(function(){ if(ov && ov.parentNode) ov.classList.add('km-show'); }, DELAY);
})();
</script>
