name: Deploy a GitHub Pages

# Construye el sitio Astro y lo publica en GitHub Pages.
# Requiere: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/upbeat-cerf-MyK82
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

# Permisos necesarios para desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        # Usa la versión de Node por defecto de la action e instala con el
        # lockfile del repo (package-lock.json → npm ci).

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
